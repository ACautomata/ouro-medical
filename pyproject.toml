[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobius"
version = "0.1.0"
description = "Ouro Looped Language Model adapted for medical domain research"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.1",
    "transformers>=4.55.0,<4.56.0",
    "monai>=1.4",
    "nibabel>=5.0",
    "stable-pretraining>=0.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mobius"]

[tool.ruff]
line-length = 120
target-version = "py310"
